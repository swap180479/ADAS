name: ADAS AEB Source Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure source project
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build source library
        run: cmake --build build --parallel
